<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 420px;
        }

        h1 {
            margin-top: 0;
            color: #1f2937;
        }

        input, button {
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        #output {
            margin-top: 16px;
            font-weight: bold;
            color: #0f172a;
        }

        ul {
            padding-left: 18px;
            color: #374151;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Belajar JavaScript</h1>
        <label for="nama">Masukkan nama kamu:</label>
        <input id="nama" type="text" placeholder="Contoh: Budi">
        <button id="tombol">Klik saya</button>
        <p id="output">Halo, siap belajar JavaScript?</p>

        <ul>
            <li>Variabel</li>
            <li>Fungsi</li>
            <li>Event</li>
            <li>DOM</li>
        </ul>
    </div>

    <script src="satu.js"></script>
</body>
</html>
